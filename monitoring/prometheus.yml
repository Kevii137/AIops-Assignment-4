global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "node"
    scrape_interval: 1s
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          tier: "infrastructure"

  - job_name: "caption_app"
    scrape_interval: 1s
    static_configs:
      - targets: ["localhost:18000"]
        labels:
          tier: "application"
          app: "image-captioning"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
